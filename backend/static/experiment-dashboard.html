<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验结果仪表板 - Daily News</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls select, .controls input {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .controls select:focus, .controls input:focus {
            border-color: #667eea;
        }

        .controls button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .dashboard {
            padding: 30px;
        }

        .experiment-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .experiment-info h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .experiment-info p {
            color: #666;
            margin-bottom: 5px;
        }

        .experiment-info .status {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status.draft {
            background: #ffc107;
            color: #000;
        }

        .status.running {
            background: #28a745;
            color: white;
        }

        .status.paused {
            background: #dc3545;
            color: white;
        }

        .status.completed {
            background: #6c757d;
            color: white;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .metric-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .metric-card h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .metric-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .metric-card .label {
            font-size: 14px;
            color: #666;
        }

        .chart-container {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .chart-container h3 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .variants-table {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .variants-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .variants-table th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .variants-table td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .variants-table tr:hover {
            background: #f8f9fa;
        }

        .variant-config {
            font-size: 12px;
            color: #666;
            font-family: monospace;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .summary-card .value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .summary-card .label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 A/B测试实验结果仪表板</h1>
            <p>实时查看实验数据和统计分析</p>
        </div>

        <div class="controls">
            <select id="experimentSelect">
                <option value="">选择实验...</option>
            </select>
            <button onclick="loadExperimentReport()">加载报告</button>
            <button onclick="loadExperimentList()">刷新列表</button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="no-data">
                <h3>👋 欢迎使用实验结果仪表板</h3>
                <p>请从上方选择一个实验来查看详细报告</p>
            </div>
        </div>
    </div>

    <script>
        // API基础URL
        const API_BASE = '/api/experiments';
        
        // 缓存实验列表
        let experiments = [];
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadExperimentList();
        });
        
        // 加载实验列表
        async function loadExperimentList() {
            try {
                const response = await fetch(`${API_BASE}/list`);
                if (!response.ok) throw new Error('加载实验列表失败');
                
                experiments = await response.json();
                
                const select = document.getElementById('experimentSelect');
                select.innerHTML = '<option value="">选择实验...</option>';
                
                experiments.forEach(exp => {
                    const option = document.createElement('option');
                    option.value = exp.name;
                    option.textContent = `${exp.name} (${exp.status})`;
                    select.appendChild(option);
                });
                
                // 如果有实验，自动选择第一个
                if (experiments.length > 0) {
                    select.value = experiments[0].name;
                    loadExperimentReport();
                }
                
            } catch (error) {
                console.error('加载实验列表失败:', error);
                showError('加载实验列表失败: ' + error.message);
            }
        }
        
        // 加载实验报告
        async function loadExperimentReport() {
            const experimentName = document.getElementById('experimentSelect').value;
            
            if (!experimentName) {
                showError('请先选择一个实验');
                return;
            }
            
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '<div class="loading">正在加载实验报告</div>';
            
            try {
                const response = await fetch(`${API_BASE}/report/${experimentName}`);
                if (!response.ok) throw new Error('加载实验报告失败');
                
                const report = await response.json();
                renderReport(report);
                
            } catch (error) {
                console.error('加载实验报告失败:', error);
                showError('加载实验报告失败: ' + error.message);
            }
        }
        
        // 渲染实验报告
        function renderReport(report) {
            const dashboard = document.getElementById('dashboard');
            
            // 实验基本信息
            const experiment = report.experiment;
            const variants = report.variants;
            const results = report.results;
            const totalUsers = report.total_users;
            
            // 计算总转化率和最佳版本
            let totalConversions = 0;
            let bestVariant = null;
            let bestRate = 0;
            
            results.forEach(result => {
                totalConversions += result.conversion_events;
                if (result.conversion_rate > bestRate) {
                    bestRate = result.conversion_rate;
                    bestVariant = result.variant_name;
                }
            });
            
            const overallRate = totalUsers > 0 ? (totalConversions / totalUsers * 100).toFixed(1) : 0;
            
            // 生成HTML
            dashboard.innerHTML = `
                <div class="experiment-info">
                    <h2>${experiment.name}</h2>
                    <p>${experiment.description || '暂无描述'}</p>
                    <p><strong>创建时间:</strong> ${new Date(experiment.created_at).toLocaleString('zh-CN')}</p>
                    ${experiment.started_at ? `<p><strong>开始时间:</strong> ${new Date(experiment.started_at).toLocaleString('zh-CN')}</p>` : ''}
                    ${experiment.completed_at ? `<p><strong>完成时间:</strong> ${new Date(experiment.completed_at).toLocaleString('zh-CN')}</p>` : ''}
                    <span class="status ${experiment.status}">${getStatusText(experiment.status)}</span>
                </div>
                
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="value">${totalUsers}</div>
                        <div class="label">总参与用户</div>
                    </div>
                    <div class="summary-card">
                        <div class="value">${overallRate}%</div>
                        <div class="label">总体转化率</div>
                    </div>
                    <div class="summary-card">
                        <div class="value">${bestVariant || '-'}</div>
                        <div class="label">最佳版本</div>
                    </div>
                    <div class="summary-card">
                        <div class="value">${variants.length}</div>
                        <div class="label">实验版本数</div>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h3>转化率对比</h3>
                    <canvas id="conversionChart"></canvas>
                </div>
                
                <div class="metrics-grid">
                    ${results.map(result => `
                        <div class="metric-card">
                            <h3>${result.variant_name}</h3>
                            <div class="value">${result.user_count}</div>
                            <div class="label">用户数</div>
                        </div>
                        <div class="metric-card">
                            <h3>${result.variant_name}</h3>
                            <div class="value">${result.conversion_rate}%</div>
                            <div class="label">转化率</div>
                        </div>
                    `).join('')}
                </div>
                
                <div class="variants-table">
                    <table>
                        <thead>
                            <tr>
                                <th>版本名称</th>
                                <th>描述</th>
                                <th>流量权重</th>
                                <th>用户数</th>
                                <th>转化率</th>
                                <th>配置</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.map(result => {
                                const variant = variants.find(v => v.id === result.variant_id);
                                return `
                                    <tr>
                                        <td><strong>${result.variant_name}</strong></td>
                                        <td>${variant?.description || '-'}</td>
                                        <td>${variant?.traffic_weight || 0}</td>
                                        <td>${result.user_count}</td>
                                        <td><strong>${result.conversion_rate}%</strong></td>
                                        <td><div class="variant-config" title='${JSON.stringify(variant?.config || {})}'>${JSON.stringify(variant?.config || {})}</div></td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            
            // 渲染图表
            renderConversionChart(results);
        }
        
        // 渲染转化率图表
        function renderConversionChart(results) {
            const ctx = document.getElementById('conversionChart');
            if (!ctx) return;
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: results.map(r => r.variant_name),
                    datasets: [{
                        label: '转化率 (%)',
                        data: results.map(r => r.conversion_rate),
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(118, 75, 162, 0.8)',
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)'
                        ],
                        borderColor: [
                            'rgba(102, 126, 234, 1)',
                            'rgba(118, 75, 162, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(54, 162, 235, 1)'
                        ],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return '转化率: ' + context.parsed.y + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'draft': '草稿',
                'running': '运行中',
                'paused': '已暂停',
                'completed': '已完成'
            };
            return statusMap[status] || status;
        }
        
        // 显示错误信息
        function showError(message) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = `<div class="error">${message}</div>`;
        }
    </script>
</body>
</html>
