version: '3.8'

services:
  # 后端API服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daily-digest-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-18888}:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - daily-digest-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - db

  # PostgreSQL数据库（可选，如果使用SQLite可以注释掉）
  db:
    image: postgres:15-alpine
    container_name: daily-digest-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dailydigest}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - daily-digest-network
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 前端Web服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:18888}
    container_name: daily-digest-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18889}:80"
    env_file:
      - .env
    networks:
      - daily-digest-network
    depends_on:
      - backend
    # 如果需要动态配置API地址，可以添加nginx模板
    # volumes:
    #   - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
    driver: local

networks:
  daily-digest-network:
    driver: bridge
